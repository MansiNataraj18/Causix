[project]
name = "causix-issue-agent"
version = "0.1.0"
description = "Causix issue agent"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
requires-python = ">=3.12.10,<3.14"
dependencies = [
    "pydantic>=2",
    "causix-core",
]

[tool.uv.sources]
causix-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["causix_issue_agent"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.3.0", "pytest-cov==6.3.0", "ruff==0.12.12",
       "black==25.12.0", "httpx>=0.27"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# arize-phoenix (pulled in by aetherion-sdk) ships a pytest plugin that fails to import against graphql-core 3.3
addopts = "-p no:phoenix"
pythonpath = ["."]
testpaths = ["tests"]
