[project]
name = "causix-orchestrator"
version = "0.1.0"
description = "Causix orchestrator, API and Aetherion agent entrypoint"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
requires-python = ">=3.12.10,<3.14"
dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.55-cp312-cp312-macosx_15_0_arm64.whl",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "causix-core",
    "causix-issue-agent",
    "causix-rca-agent",
    "causix-impact-agent",
    "causix-fix-agent",
    "causix-scenario-agent",
    "causix-documentation-agent",
]

[project.optional-dependencies]
validation = ["testcontainers>=4.8"]


[tool.uv.sources]
causix-core = { workspace = true }
causix-issue-agent = { workspace = true }
causix-rca-agent = { workspace = true }
causix-impact-agent = { workspace = true }
causix-fix-agent = { workspace = true }
causix-scenario-agent = { workspace = true }
causix-documentation-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.3.0", "pytest-cov==6.3.0", "ruff==0.12.12",
       "black==25.12.0", "httpx>=0.27", "testcontainers>=4.8"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# arize-phoenix (pulled in by aetherion-sdk) ships a pytest plugin that fails to import against graphql-core 3.3
addopts = "-p no:phoenix"
pythonpath = ["."]
testpaths = ["tests"]
